<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green House — Resta Port Said Hotel</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3CradialGradient%20id%3D%22bg%22%20cx%3D%2235%25%22%20cy%3D%2230%25%22%20r%3D%2275%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231a2e1c%22/%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230d0d0d%22/%3E%3C/radialGradient%3E%3ClinearGradient%20id%3D%22leafGrad%22%20x1%3D%220%25%22%20y1%3D%22100%25%22%20x2%3D%22100%25%22%20y2%3D%220%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23c9a84c%22/%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23e4c97e%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2231%22%20fill%3D%22url%28%23bg%29%22%20stroke%3D%22%23c9a84c%22%20stroke-width%3D%221.5%22/%3E%3Cpath%20d%3D%22M20%2044%20C18%2030%2022%2016%2040%2013%20C43%2028%2038%2042%2020%2044%20Z%22%0A%20%20%20%20%20%20%20%20fill%3D%22url%28%23leafGrad%29%22%20stroke%3D%22%23f5f0e8%22%20stroke-width%3D%220.8%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M21%2043%20C24%2032%2030%2021%2039%2014%22%20stroke%3D%22%230d0d0d%22%20stroke-width%3D%221.1%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%20opacity%3D%220.5%22/%3E%3Cpath%20d%3D%22M26%2035%20L21%2033%20M29%2029%20L24.5%2026.5%20M33%2023%20L29%2020.5%22%20stroke%3D%22%230d0d0d%22%20stroke-width%3D%220.8%22%20stroke-linecap%3D%22round%22%20opacity%3D%220.4%22%20fill%3D%22none%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e4c97e;
    --dark: #0d0d0d;
    --dark-2: #161610;
    --cream: #f5f0e8;
    --cream-2: #ede5d4;
    --text-light: #d6cbb4;
    --green: #2a3d2e;
    --green-light: #3a5440;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background-color: var(--dark);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, #1a2e1c 0%, var(--dark) 70%);
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(201,168,76,0.04) 60px, rgba(201,168,76,0.04) 61px),
      repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(201,168,76,0.04) 60px, rgba(201,168,76,0.04) 61px);
    pointer-events: none;
  }

  .hero-ornament {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.1);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: pulse-ring 4s ease-in-out infinite;
  }
  .hero-ornament:nth-child(2) { width: 800px; height: 800px; animation-delay: 1s; opacity: 0.6; }
  .hero-ornament:nth-child(3) { width: 1000px; height: 1000px; animation-delay: 2s; opacity: 0.3; }

  @keyframes pulse-ring {
    0%, 100% { opacity: 0.15; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 0.35; transform: translate(-50%,-50%) scale(1.02); }
  }

  .hero-inner { position: relative; z-index: 2; }

  .hotel-name {
    font-family: 'Tajawal', sans-serif;
    font-weight: 300;
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.3s forwards;
  }

  .hero-divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 2rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.5s forwards;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(4rem, 12vw, 9rem);
    font-weight: 400;
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--cream);
    opacity: 0;
    animation: fadeUp 1s ease 0.7s forwards;
  }
  .hero-title em {
    font-style: italic;
    color: var(--gold-light);
  }

  .hero-subtitle {
    font-family: 'Tajawal', sans-serif;
    font-weight: 300;
    font-size: 1rem;
    letter-spacing: 0.25em;
    color: var(--text-light);
    margin-top: 2rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.9s forwards;
  }

  .hero-scroll {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 1.5s forwards;
    cursor: pointer;
    text-decoration: none;
  }
  .hero-scroll span {
    font-family: 'Tajawal', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .hero-scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--gold), transparent);
    animation: scroll-line 1.5s ease-in-out infinite;
  }
  @keyframes scroll-line {
    0% { transform: scaleY(0); transform-origin: top; }
    50% { transform: scaleY(1); transform-origin: top; }
    51% { transform: scaleY(1); transform-origin: bottom; }
    100% { transform: scaleY(0); transform-origin: bottom; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── NAV ── */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,13,13,0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(201,168,76,0.2);
    padding: 0 2rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav-inner {
    display: flex;
    gap: 0;
    min-width: max-content;
    margin: 0 auto;
    max-width: 1100px;
  }
  .nav a {
    display: block;
    padding: 1.1rem 1.5rem;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.25em;
    color: var(--text-light);
    text-decoration: none;
    text-transform: uppercase;
    border-bottom: 2px solid transparent;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  .nav a:hover {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  /* ── SECTION ── */
  .section {
    max-width: 1100px;
    margin: 0 auto;
    padding: 6rem 2rem;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 2rem;
    margin-bottom: 4rem;
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.7s ease;
  }
  .section-header.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .section-header-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .section-header-line.right {
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .section-title-wrap { text-align: center; }
  .section-category {
    font-family: 'Tajawal', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.5em;
    color: var(--gold);
    text-transform: uppercase;
    display: block;
    margin-bottom: 0.4rem;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 400;
    color: var(--cream);
    line-height: 1;
  }

  /* ── MENU GRID ── */
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5px;
    background: rgba(201,168,76,0.15);
    border: 1px solid rgba(201,168,76,0.15);
  }

  .menu-item {
    background: var(--dark-2);
    padding: 2.2rem 2rem;
    position: relative;
    transition: background 0.3s ease;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease, background 0.3s ease;
  }
  .menu-item.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .menu-item:hover {
    background: #1a1a12;
  }
  .menu-item:hover .item-corner {
    opacity: 1;
  }

  .item-corner {
    position: absolute;
    top: 1rem;
    left: 1rem;
    width: 20px;
    height: 20px;
    border-top: 1px solid var(--gold);
    border-right: 1px solid var(--gold);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .item-corner.br {
    top: auto; left: auto;
    bottom: 1rem; right: 1rem;
    border-top: none; border-right: none;
    border-bottom: 1px solid var(--gold);
    border-left: 1px solid var(--gold);
  }

  .item-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 400;
    color: var(--cream);
    margin-bottom: 0.6rem;
    letter-spacing: 0.03em;
  }

  .item-desc {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.9rem;
    font-style: italic;
    color: var(--text-light);
    line-height: 1.6;
    margin-bottom: 1.2rem;
  }

  .item-price {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--gold);
    letter-spacing: 0.05em;
  }
  .item-price span {
    font-size: 0.7rem;
    font-family: 'Tajawal', sans-serif;
    color: var(--gold-light);
    margin-right: 0.2rem;
    opacity: 0.8;
  }

  .item-name-ar {
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    font-size: 0.88rem;
    color: var(--gold-light);
    margin-bottom: 0.5rem;
    opacity: 1;
    direction: rtl;
  }

  .item-desc-ar {
    font-family: 'Tajawal', sans-serif;
    font-weight: 400;
    font-size: 0.82rem;
    color: var(--text-light);
    line-height: 1.7;
    margin-bottom: 1.2rem;
    direction: rtl;
  }

  .item-divider {
    width: 100%;
    height: 1px;
    background: rgba(201,168,76,0.12);
    margin: 0.8rem 0;
  }

  /* ── SECTION DIVIDER ── */
  .section-divider {
    text-align: center;
    padding: 3rem 0;
    overflow: hidden;
  }
  .section-divider-inner {
    display: inline-flex;
    align-items: center;
    gap: 1.5rem;
  }
  .divider-line { width: 120px; height: 1px; background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4)); }
  .divider-line.r { background: linear-gradient(90deg, rgba(201,168,76,0.4), transparent); }
  .divider-diamond {
    width: 8px;
    height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid rgba(201,168,76,0.2);
    padding: 3rem 2rem;
    text-align: center;
    background: var(--dark-2);
  }
  .footer-logo {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 400;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }
  .footer-logo em { font-style: italic; color: var(--cream); }
  .footer-note {
    font-family: 'Tajawal', sans-serif;
    font-size: 0.78rem;
    color: rgba(214,203,180,0.75);
    letter-spacing: 0.15em;
    margin-top: 1.5rem;
  }
  .footer-taxes {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: rgba(214,203,180,0.7);
    margin-top: 0.5rem;
  }
</style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-ornament"></div>
  <div class="hero-ornament"></div>
  <div class="hero-ornament"></div>
  <div class="hero-inner">
    <p class="hotel-name">Resta Port Said Hotel</p>
    <div class="hero-divider"></div>
    <h1 class="hero-title">Green<br><em>House</em></h1>
    <p class="hero-subtitle">قائمة الطعام &nbsp;·&nbsp; The Menu</p>
  </div>
  <a class="hero-scroll" href="#appetizers">
    <span>Explore</span>
    <div class="hero-scroll-line"></div>
  </a>
</section>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner" id="navLinks"></div>
</nav>

<!-- القائمة تُرسم تلقائياً من greenhouse_data.js -->
<div id="menu"></div>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">Green <em>House</em></div>
  <p style="font-family:'Tajawal',sans-serif;font-size:0.8rem;color:rgba(214,203,180,0.8);letter-spacing:0.2em;margin-top:0.3rem;">RESTA PORT SAID HOTEL</p>
  <p class="footer-taxes">All prices are inclusive of 12% service charge and 14% taxes</p>
  <p class="footer-note" style="margin-top:1rem;">الأسعار شامله ١٢% خدمة و ١٤% ضريبة مضافة</p>
</footer>

<script src="greenhouse_data.js"></script>
<script>
  /* ── Render menu from greenhouse_data.js ── */
  function esc(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function fmt(n) {
    const v = Number(n);
    return isNaN(v) ? esc(n) : v.toFixed(2);
  }
  function buildNavHTML(sections) {
    return sections.map(s => `<a href="#${esc(s.id)}">${esc(s.en)}</a>`).join('');
  }
  function buildMenuHTML(sections) {
    return sections.map(sec => {
      const items = sec.items.map(it =>
        `<div class="menu-item"><div class="item-corner"></div><div class="item-corner br"></div><h3 class="item-name">${esc(it.en)}</h3><p class="item-name-ar">${esc(it.ar)}</p><p class="item-desc">${esc(it.descEn)}</p><div class="item-divider"></div><p class="item-desc-ar">${esc(it.descAr)}</p><p class="item-price"><span>L.E</span> ${fmt(it.price)}</p></div>`
      ).join('');
      return `<section id="${esc(sec.id)}" class="section"><div class="section-header"><div class="section-header-line"></div><div class="section-title-wrap"><span class="section-category">${esc(sec.ar)}</span><h2 class="section-title">${esc(sec.en)}</h2></div><div class="section-header-line right"></div></div><div class="menu-grid">${items}</div></section>`;
    }).join('<div class="section-divider"><div class="section-divider-inner"><div class="divider-line"></div><div class="divider-diamond"></div><div class="divider-line r"></div></div></div>');
  }
  (function () {
    const slot = document.getElementById('menu');
    if (typeof MENU_SECTIONS === 'undefined') {
      slot.innerHTML = '<p style="text-align:center;padding:60px 20px;color:rgba(214,203,180,0.9)">تعذر تحميل greenhouse_data.js — تأكد أنه في نفس مجلد هذا الملف.</p>';
      return;
    }
    document.getElementById('navLinks').innerHTML = buildNavHTML(MENU_SECTIONS);
    slot.insertAdjacentHTML('beforebegin', buildMenuHTML(MENU_SECTIONS));
    slot.remove();
  })();
</script>
<script>
  // Intersection Observer for scroll animations
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        const el = entry.target;
        const delay = el.dataset.delay || 0;
        setTimeout(() => el.classList.add('visible'), delay);
        observer.unobserve(el);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.section-header').forEach(el => observer.observe(el));

  document.querySelectorAll('.menu-item').forEach((el, i) => {
    el.dataset.delay = (i % 3) * 80;
    observer.observe(el);
  });
</script>
</body>
</html>
